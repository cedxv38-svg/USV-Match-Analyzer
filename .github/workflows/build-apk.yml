name: Build USV Troc Android

on:
  workflow_dispatch:
  push:
    branches: [ usv-troc-apk ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate temporary signing key
        shell: bash
        run: |
          PASS=$(openssl rand -hex 16)
          echo "USV_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "USV_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "USV_KEY_ALIAS=usvtroc" >> "$GITHUB_ENV"
          echo "USV_KEYSTORE_PATH=$RUNNER_TEMP/usv-troc-release.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/usv-troc-release.jks" \
            -storepass "$PASS" \
            -alias usvtroc \
            -keypass "$PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=USV Troc, OU=USV, O=USV, C=FR"

      - name: Build signed APK and AAB
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk USV-Troc-v1.apk
          cp app/build/outputs/bundle/release/app-release.aab USV-Troc-v1.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1-APK
          path: USV-Troc-v1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1-PlayStore-AAB
          path: USV-Troc-v1.aab
          if-no-files-found: error
          retention-days: 30
