name: Build USV Troc Android

on:
  workflow_dispatch:
  push:
    branches: [ usv-troc-apk ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent Play upload keystore
        shell: bash
        env:
          USV_KEYSTORE_B64: ${{ secrets.USV_KEYSTORE_B64 }}
        run: |
          test -n "$USV_KEYSTORE_B64" || { echo "Missing USV_KEYSTORE_B64 secret"; exit 1; }
          echo "$USV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/usv-troc-upload.jks"
          echo "USV_KEYSTORE_PATH=$RUNNER_TEMP/usv-troc-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_PASSWORD: ${{ secrets.USV_KEY_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
        run: |
          test -n "$USV_STORE_PASSWORD" || { echo "Missing USV_STORE_PASSWORD secret"; exit 1; }
          test -n "$USV_KEY_PASSWORD" || { echo "Missing USV_KEY_PASSWORD secret"; exit 1; }
          test -n "$USV_KEY_ALIAS" || { echo "Missing USV_KEY_ALIAS secret"; exit 1; }
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk USV-Troc-v1.0.7.apk
          cp app/build/outputs/bundle/release/app-release.aab USV-Troc-v1.0.7.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1.0.7-APK
          path: USV-Troc-v1.0.7.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1.0.7-PlayStore-AAB
          path: USV-Troc-v1.0.7.aab
          if-no-files-found: error
          retention-days: 30
