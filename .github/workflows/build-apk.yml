name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate temporary release signing key
        shell: bash
        run: |
          PASS=$(openssl rand -hex 16)
          echo "USV_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "USV_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "USV_KEY_ALIAS=usvkey" >> "$GITHUB_ENV"
          echo "USV_KEYSTORE_PATH=$RUNNER_TEMP/usv-release.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/usv-release.jks" \
            -storepass "$PASS" \
            -alias usvkey \
            -keypass "$PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=USV Match Analyzer, OU=USV, O=USV, C=FR"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk USV-Match-Analyzer-v3-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USV-Match-Analyzer-v3-Release
          path: USV-Match-Analyzer-v3-release.apk
          if-no-files-found: error
